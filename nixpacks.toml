# Nixpacks build config — Coolify's default build pack reads this from the repo root.
# (Node + pnpm. The Dockerfile is an optional alternative, ignored under Nixpacks.)

[variables]
PORT = "3000"
QQ_NO_OPEN = "1"
PERSIST_DIR = "/app/persist"

# No native build deps — the DB uses Node's built-in node:sqlite. (Needs Node
# >= 22.13; .nvmrc pins 22.)

# Build the React client into dist/ (the server serves it in production).
[phases.build]
cmds = ["pnpm run build"]

# Run the server only — no rebuild. NODE_ENV is set inline here (NOT in [variables])
# so it doesn't switch pnpm to prod-only and skip the dev deps needed for the build.
[start]
cmd = "NODE_ENV=production node --disable-warning=ExperimentalWarning server/index.js"
